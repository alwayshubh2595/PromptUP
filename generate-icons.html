<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PromptUp Icon Generator</title>
  <style>
    body { background: #16161e; color: #cdd6f4; font-family: sans-serif; padding: 40px; }
    canvas { border-radius: 8px; margin: 16px; }
    h2 { color: #cba6f7; margin-bottom: 8px; }
    p { color: #6c7086; margin-bottom: 24px; }
    .canvases { display: flex; align-items: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <h2>PromptUp Icon Generator</h2>
  <p>Icons are downloading automatically. Move them into the <code>icons/</code> folder of the extension.</p>
  <div class="canvases" id="canvases"></div>

<script>
function drawIcon(size) {
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  const r = size * 0.18; // corner radius

  // Background: rounded rect, deep purple
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();

  // Gradient background
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, "#1e1e2e");
  grad.addColorStop(1, "#2a1f3d");
  ctx.fillStyle = grad;
  ctx.fill();

  // Lightning bolt
  ctx.save();
  ctx.translate(size / 2, size / 2);

  const s = size * 0.52;
  ctx.beginPath();

  // Bolt shape: top-right slant down to middle, then bottom-left
  ctx.moveTo(s * 0.12, -s * 0.5);       // top-right of upper segment
  ctx.lineTo(-s * 0.18, s * 0.04);      // middle-left
  ctx.lineTo(s * 0.08, s * 0.04);       // middle-right (notch)
  ctx.lineTo(-s * 0.12, s * 0.5);       // bottom-left of lower segment
  ctx.lineTo(s * 0.18, -s * 0.04);     // middle-right
  ctx.lineTo(-s * 0.08, -s * 0.04);    // middle-left (notch)
  ctx.closePath();

  // Bolt fill: accent purple to white
  const boltGrad = ctx.createLinearGradient(0, -s * 0.5, 0, s * 0.5);
  boltGrad.addColorStop(0, "#ffffff");
  boltGrad.addColorStop(1, "#cba6f7");
  ctx.fillStyle = boltGrad;
  ctx.fill();

  ctx.restore();

  return canvas;
}

const sizes = [16, 48, 128];
const container = document.getElementById("canvases");

sizes.forEach(size => {
  const canvas = drawIcon(size);
  canvas.title = `${size}x${size}`;
  container.appendChild(canvas);

  // Auto-download
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = `icon${size}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});
</script>
</body>
</html>
